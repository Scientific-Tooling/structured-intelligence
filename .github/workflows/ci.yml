name: validate-structure

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install registry validator dependency
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Validate repository structure
        run: bash ./scripts/validate_structure.sh

  reading-adapter:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test research adapters
        run: python scripts/run_research_tests.py
      - name: Validate scientific corpus and frozen questions
        run: python scripts/research_corpus.py validate
