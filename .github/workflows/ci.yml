name: validate-structure

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install registry validator dependency
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Validate repository structure
        run: bash ./scripts/validate_structure.sh

  reading-adapter:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12', '3.13', '3.14', '3.15']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check advanced manual command syntax
        run: python -m unittest discover -s tests -p test_manual_docs.py -v
      - name: Test research adapters
        run: python scripts/run_research_tests.py
      - name: Validate scientific corpus and frozen questions
        run: python scripts/research_corpus.py validate

  installed-workflow:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.13'
          - os: ubuntu-latest
            python: '3.14'
          - os: ubuntu-latest
            python: '3.15'
          - os: windows-latest
            python: '3.14'
          - os: macos-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build distribution
        run: |
          python -m pip install build
          python -m build
      - name: Install wheel and its pinned public dependencies
        run: python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'pip', 'install', *glob.glob('dist/*.whl')])"
      - name: Verify installed workflow and interruption recovery
        run: python scripts/run_research_tests.py discover -s tests -p test_workflow.py -v
      - name: Verify reading and evidence adapters against installed packages
        shell: python
        run: |
          import os, subprocess, sys
          environment = {**os.environ, "RKS_TEST_PYTHON": sys.executable, "APW_TEST_PYTHON": sys.executable}
          subprocess.run([sys.executable, "scripts/run_research_tests.py", "discover", "-s", "tests", "-p", "test_*integration.py", "-v"], env=environment, check=True)

  workflow-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Scientific-Tooling/agent-pdf-workbench
          ref: 36112db1776b8543a062f57234df7290309137dc
          path: apw
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apw/package-lock.json
      - name: Install workflow and browser test dependency
        run: |
          python -m pip install .
          npm ci --prefix apw
          cd apw
          npx playwright install --with-deps chromium
      - name: Verify highlight to brief and resumed passage link
        run: node scripts/verify_workflow_browser.mjs "$(command -v python)" "$PWD/apw" "$RUNNER_TEMP/workflow-browser"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workflow-browser
          path: |
            ${{ runner.temp }}/workflow-browser/*.png
            ${{ runner.temp }}/workflow-browser/*.json
            ${{ runner.temp }}/workflow-browser/*.md
          retention-days: 7

  unix-walkthrough:
    name: Unix walkthrough (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shells: bash
          - os: macos-latest
            shells: bash zsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m unittest discover -s tests -p test_manual_docs.py -v
      - name: Run the documented Unix workflow
        shell: bash
        run: |
          set -euo pipefail
          for smoke_shell in ${{ matrix.shells }}; do
            python tests/verify_unix_walkthrough.py --shell "$smoke_shell"
          done
      - name: Retain walkthrough diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unix-walkthrough-${{ matrix.os }}
          path: |
            .workflow-test/manual/unix-*/terminal-*.log
            .workflow-test/manual/unix-*/receipt.json
            .workflow-test/manual/unix-*/terminal-a.sh
            .workflow-test/manual/unix-*/server-sample.txt
          retention-days: 7
          include-hidden-files: true
