[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-tooling"
version = "0.3.0"
description = "Resumable multi-paper research projects and source-linked briefs for researchers and agents."
readme = "workflows/research/quickstart.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "research-knowledge-substrate @ git+https://github.com/Scientific-Tooling/research-knowledge-substrate.git@fd44ad7388abb482a5980508531383cacf4da381",
  "agent-pdf-workbench @ git+https://github.com/Scientific-Tooling/agent-pdf-workbench.git@36112db1776b8543a062f57234df7290309137dc",
]

[project.scripts]
sci = "scientific_tooling.cli:main"
scientific-tooling = "scientific_tooling.cli:main"

[tool.setuptools]
include-package-data = false
packages = ["scientific_tooling", "scientific_tooling.agent_skill"]
package-dir = {"" = "src", "scientific_tooling.agent_skill" = "skills/paper-to-brief"}

[tool.setuptools.package-data]
"scientific_tooling.agent_skill" = ["SKILL.md", "agents/*.yaml"]
